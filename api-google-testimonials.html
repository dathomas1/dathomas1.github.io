<html lang="en">
<head></head>
<body>
<!-- 1. The Testimonial Grid Container -->
<div id="testimonial-listings-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; font-family: sans-serif; background-color: #f9f9f9; padding: 20px;">
  <!-- Component card elements inject cleanly here via JavaScript DOM Nodes -->
</div>

<!-- 3. Safe Element Construction and Sync Logic -->
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby0weMofJB7pZ6k97WCF8BW2nZTRnxvQLYBEawV2aFChs0jDMGpY1dABNo-sqr3_vIVtg/exec';

async function fetchTestimonials() {
  try {
    const response = await fetch(API_URL);
    const testimonials = await response.json();
    
    const gridContainer = document.getElementById('testimonial-listings-grid');
    gridContainer.innerHTML = ''; 
    
    testimonials.forEach(item => {
      // Handle converting Google Drive avatar assets cleanly
      let finalAvatarImage = 'https://placeholder.com';
      if (item.photoUrl) {
        if (item.photoUrl.includes('://google.com')) {
          const fileIdMatch = item.photoUrl.match(/id=([^&]+)/);
          if (fileIdMatch && fileIdMatch[1]) {
            finalAvatarImage = `https://googleusercontent.com{fileIdMatch[1]}`;
          }
        } else if (item.photoUrl.startsWith('http')) {
          finalAvatarImage = item.photoUrl;
        }
      }

      // Create the main card container node
      const card = document.createElement('div');
      card.style.cssText = "border: 1px solid #e2e8f0; border-radius: 10px; padding: 24px; background: #fff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between;";

      // Top Section Wrapper
      const topSection = document.createElement('div');
      
      const ratingDiv = document.createElement('div');
      ratingDiv.style.cssText = "color: #ffc107; font-size: 18px; margin-bottom: 12px;";
      ratingDiv.textContent = item.rating || '★★★★★';

      const quoteElement = document.createElement('p');
      quoteElement.style.cssText = "color: #4a5568; font-style: italic; line-height: 1.6; margin: 0 0 20px 0; font-size: 15px;";
      // SAFE STEP: textContent completely sanitizes quotes, double-quotes, and special chars
      quoteElement.textContent = `"${item.quote}"`;

      topSection.appendChild(ratingDiv);
      topSection.appendChild(quoteElement);

      // Bottom Section Wrapper
      const bottomSection = document.createElement('div');
      bottomSection.style.cssText = "display: flex; align-items: center; justify-content: space-between; margin-top: auto; border-top: 1px solid #edf2f7; padding-top: 15px;";

      const userProfile = document.createElement('div');
      userProfile.style.cssText = "display: flex; align-items: center;";

      const avatar = document.createElement('img');
      avatar.src = finalAvatarImage;
      avatar.alt = item.name || 'Anonymous';
      avatar.style.cssText = "width: 44px; height: 44px; border-radius: 50%; object-fit: cover; margin-right: 12px; background: #eee;";

      const profileName = document.createElement('strong');
      profileName.style.cssText = "color: #2d3748; font-size: 15px;";
      // SAFE STEP: item.name is securely protected here
      profileName.textContent = item.name || 'Anonymous';

      userProfile.appendChild(avatar);
      userProfile.appendChild(profileName);

      const contactButton = document.createElement('button');
      contactButton.style.cssText = "background: #edf2f7; color: #4a5568; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;";
      contactButton.textContent = "Contact";
      
      // SAFE STEP: Passing directly as a data variable string instead of breaking inline onClick string scripts
      contactButton.addEventListener('click', () => {
        openModal(item.name || 'Anonymous');
      });

      bottomSection.appendChild(userProfile);
      bottomSection.appendChild(contactButton);

      // Assemble card elements cleanly
      card.appendChild(topSection);
      card.appendChild(bottomSection);
      gridContainer.appendChild(card);
    });
    
    if (testimonials.length === 0) {
      gridContainer.innerHTML = '<p style="text-align:center; width:100%; color:#718096;">No active testimonials found.</p>';
    }
  } catch (error) {
    console.error('Error fetching layout data:', error);
    document.getElementById('testimonial-listings-grid').innerHTML = '<p style="color: red; text-align: center;">Error running the secure api proxy pipeline.</p>';
  }
}

fetchTestimonials();
</script>

</body>
</html>
